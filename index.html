<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conferma Pagamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .hero-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1.15rem;
      background: #ffd100;
      display: block;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #475569;
    }
    button {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #0f172a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.99);
    }
